<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CED1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="50"/>

  <!-- RPS Symbols -->
  <text x="128" y="220" font-size="120" fill="#FFD700" font-family="Arial" font-weight="bold">✊</text>
  <text x="256" y="220" font-size="120" fill="#00ff00" font-family="Arial" font-weight="bold">✋</text>
  <text x="384" y="220" font-size="120" fill="#ff6666" font-family="Arial" font-weight="bold">✌</text>

  <!-- Title -->
  <text x="256" y="380" font-size="80" fill="#FFFFFF" font-family="Arial" font-weight="bold" text-anchor="middle">RPS</text>
  <text x="256" y="450" font-size="48" fill="#FFFFFF" font-family="Arial" font-weight="bold" text-anchor="middle">FIGHTERS</text>
</svg>
